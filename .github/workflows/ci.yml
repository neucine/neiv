name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quick-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked formatting dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check formatting
        run: npm run format:check
      - name: Check release tooling syntax
        run: |
          node --check tools/release.mjs
          node --check packages/neiv/scripts/build-frontend.mjs
          node --check packages/neiv/scripts/install-frontend.mjs
      - name: Run source tooling tests
        run: |
          node tests/discovery-test.mjs
          node tests/callback-generator.mjs
          node tests/install-frontend-test.mjs
